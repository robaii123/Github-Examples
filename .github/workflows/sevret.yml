name: Test API

on : [push]

jobs:
  make-api-request:
    runs-on: ubuntu-latest
    steps:
    - name: Check API key
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        if [ -n "$API_KEY" ]; then
          echo "API_KEY is configured."
        else
          echo "API_KEY is missing."
          exit 1
        fi