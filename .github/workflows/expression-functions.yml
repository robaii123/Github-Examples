name: Expression Functions Demo

on:
  push:
    branches:
      - main

jobs:
  expression-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check if string contains substring
        if: contains('Hello world', 'llo')
        run: |
          echo "The string contains the substring."

      - name: Check if string starts with
        if: startsWith('Hello world', 'He')
        run: |
          echo "The string starts with 'He'."

      - name: Check if string ends with
        if: endsWith('Hello world', 'ld')
        run: |
          echo "The string ends with 'ld'."

      - name: Format and echo string
        run: |
          echo "${{ format('Hello {0} {1} {2}', 'Mona', 'the', 'Octocat') }}"

      - name: Join issue labels
        if: github.event_name == 'issues'
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          echo "Issue labels: $LABELS"

      - name: Convert job context to JSON
        env:
          JOB_JSON: ${{ toJSON(job) }}
        run: |
          echo "Job context in JSON: $JOB_JSON"

      - name: Parse JSON string
        run: |
          echo "Parsed JSON: ${{ fromJSON('{"hello":"world"}').hello }}"

      - name: Hash files
        env:
          FILE_HASH: ${{ hashFiles('**/package-lock.json', '**/Gemfile.lock') }}
        run: |
          echo "Hash of files: $FILE_HASH"

      - name: The job has succeeded
        if: success()
        run: echo "All previous steps succeeded."

      - name: The job has failed
        if: failure()
        run: echo "A previous step failed."